<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="select_map" id="select_map">
            <h2>Выберите карту</h2>
            <select name="" id="MapSelector">
                <option value="Лес">Лес</option>
                <option value="Город">Город</option>
            </select>
            <button onclick='{selectMap()}'>Выбрать</button>
        </div>
        <div class="select_name none" id="select_name">
            <h2>Введите имя</h2>
            <input id="name_input" type="text">
            <button onclick="{selectName()}">Выбрать</button>
            <p id="error_log"></p>
        </div>
        <div class="game none" id="game">
            <div class="interface">
                <p id="timerElement">Время в игре: </p>
                <p id="monsterCount">Количество монстров: 0</p>
                <p id="trapCount">Количество ловушек: 0</p>
                <p id="lifes">Осталось жизней : 5</p>
            </div>
            <div id="gameContainer" class="">
                <div id="player" style="left: 0; top: 0;"></div>
            </div>
        </div>
    </main>
</body>

<script>
    let timeStop = false


    const selectorvalue = document.getElementById('MapSelector').value
    const select_name_block = document.getElementById('select_name')
    const select_map_block = document.getElementById('select_map')
    const game_block = document.getElementById('game')

    function selectMap(){
        if (selectorvalue == 'Лес' ){
            alert("Выбран лес")
        }
        if(selectorvalue == 'Город'){
            alert('Выбран город')
        }

        select_map_block.classList.add('none');
        select_name_block.classList.remove('none');
    }

    const input_name = document.getElementById("name_input")

    function selectName(){
        if(input_name.value == ''){
            document.getElementById('error_log').textContent = "Введите имя"
            return
        }
        else{
            select_name_block.classList.add('none');
            game_block.classList.remove('none');
        }

        StartGame()
    }

    function Timer(){

        const timerElement = document.getElementById('timerElement')

        timeMin = 0
        timeLeft = 0
        const timerId = setInterval(() => {
        timeLeft++;

        if(timeLeft == 60){
            timeMin += 1
            timeLeft = 0
        }

        timeText = timeMin + ":" + timeLeft % 60 

        timerElement.textContent = 'Время в игре: ' + timeText;
        if (timeStop == true){
            return(timeStop)

        }

        }, 1000);

    }


    const gameContainer = document.getElementById('gameContainer')
    const player = document.getElementById('player')
    const moveSpeed = 5

    let playerPosition = {
        x:0,
        y: 0
    }

    function StartGame(){
        Timer()

        document.addEventListener('keydown', (event) => {
        switch (event.key){
            case 'ArrowUp':
                movePlayer(0, -moveSpeed)
                break
            case 'ArrowDown':
                movePlayer(0, moveSpeed)
                break
            case 'ArrowLeft':
                movePlayer(-moveSpeed, 0)
                break
            case 'ArrowRight':
                movePlayer(moveSpeed, 0)
                break
            }
        })

        for (let i = 0; i < 10; i++){
            spawnMonster()
        }

        for (let j = 0; j < 2; j++){
            spawnTrap()
        }


        monsterInterval = setInterval(() => {
            for (let i = 0; i < 10; i++){
                spawnMonster()
            }

            for (let j = 0; j < 2; j++){
            spawnTrap()
        }
        }, 3000)

    }

    function spawnTrap(){
        const trap = document.createElement('div');
        trap.className = 'trap';
        gameContainer.appendChild(trap)

        trap.style.left = Math.random() * (gameContainer.clientWidth - 40) + 'px'
        trap.style.top = Math.random() * (gameContainer.clientHeight - 40) + 'px'

    }


    function spawnMonster(){
        const monster = document.createElement('div');
        monster.className = 'monster';
        gameContainer.appendChild(monster)

        monster.style.left = Math.random() * (gameContainer.clientWidth - 40) + 'px'
        monster.style.top = Math.random() * (gameContainer.clientHeight - 40) + 'px'

        moveMonster(monster);

    }

    function moveMonster(monster){
        const direction = Math.random() * 360
        const speed = 1
        const radians = direction * (Math.PI / 180)
        const dx = Math.cos(radians) * speed
        const dy = Math.sin(radians) * speed

        const inteval = setInterval(() => {
            const currentX = parseFloat(monster.style.left)
            const currentY = parseFloat(monster.style.top)

            monster.style.left = (currentX + dx) + 'px'
            monster.style.top = (currentY + dy) + 'px'


            if (currentX < 0 || currentX > gameContainer.clientWidth || currentY < 0 || currentY > gameContainer.clientHeight){
                clearInterval(inteval)
                monster.remove();
            }
        }, 100)
    }

    function movePlayer(dx,dy){
        playerPosition.x += dx;
        playerPosition.y += dy

        if(playerPosition.x < 0) playerPosition.x = 0
        if (playerPosition.x > gameContainer.clientWidth - player.clientWidth){
            playerPosition.x = gameContainer.clientHeight - player.clientHeight
        }

        if(playerPosition.y < 0) playerPosition.y = 0
        if (playerPosition.y > gameContainer.clientWidth - player.clientWidth){
            playerPosition.y = gameContainer.clientHeight - player.clientHeight
        }

        player.style.left = playerPosition.x + 'px'
        player.style.top = playerPosition.y + 'px'
    }


    

</script>
</html>
